server:
  port: 8082
spring:
  application:
    name: company-service
  datasource:
    url: jdbc:postgresql://localhost:5432/microdb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # it controls table creation strategy 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
   prefer-ip-address: true
    # This forces Eureka to show the IP in the dashboard
   instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: refresh

resilience4j:
  circuitbreaker:
    instances:
      companyService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      companyService:
        maxAttempts: 3
        waitDuration: 1s

  timelimiter:
    instances:
      companyService:
        timeoutDuration: 2s
