server:
  port: 8084
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/microdb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # it controls table creation strategy 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        # This line: map the Producer's class name to YOUR local class
        spring.json.type.mapping: "com.demo.micro.job.event.JobCreatedEvent:com.demo.micro.notify.event.JobCreatedEvent"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
     # This forces Eureka to show the IP in the dashboard
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
